name: Temporary Spade Live Audit

on:
  push:
    paths:
      - '.github/workflows/ashby-form-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch current Spade employer page
        shell: python
        run: |
          import re, urllib.request
          url='https://spade.com/careers/jobs/eeca5a13-7958-46b4-b295-8d48da58cd65/'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(req,timeout=30) as r:
              html=r.read().decode('utf-8','replace')
          text=re.sub(r'<[^>]+>',' ',html)
          text=re.sub(r'\s+',' ',text)
          for pat in ['Based in NYC','Remote','US/Canada','3+ years','5+ years','Apply','eeca5a13']:
              print('PATTERN',pat,'FOUND',pat.lower() in text.lower())
              for m in list(re.finditer(re.escape(pat), text, flags=re.I))[:3]:
                  print(text[max(0,m.start()-300):m.end()+500])
          for m in re.finditer(r'https?[^\"\'<> ]+',html):
              u=m.group(0).replace('\\u0026','&')
              if any(x in u.lower() for x in ['ashby','greenhouse','lever','apply','jobs']): print('URL',u[:500])
